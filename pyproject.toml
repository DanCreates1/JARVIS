[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "A secure, local-first personal assistant runtime."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.15.0,<3",
  "pypdf>=6.17,<7",
  "rich>=13.8,<15",
  "tzdata>=2025.2",
  "typer>=0.12,<1",
  "uvicorn>=0.34,<1",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
vision = [
  "opencv-python-headless>=5.0.0.93,<6",
  "pillow>=12.3,<13",
]
voice = [
  "faster-whisper>=1.2.1,<2",
  "numpy>=1.26,<3",
  "openwakeword>=0.6,<0.7",
  "silero-vad>=6.2.1,<7",
  "sounddevice>=0.5.5,<1",
]

[project.scripts]
jarvis = "jarvis.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "numpy>=1.26,<3",
  "pip-audit>=2.7,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
  "setuptools>=83,<85",
]

[tool.hatch.build]
include = [
  "src/jarvis/**/*.py",
  "src/jarvis/**/*.sql",
  "src/jarvis/**/*.html",
  "src/jarvis/**/*.css",
  "src/jarvis/**/*.js",
  "src/jarvis/**/*.svg",
  "src/jarvis/**/*.webmanifest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=jarvis --cov-report=term-missing --cov-fail-under=85"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jarvis"]
omit = ["src/jarvis/research/_parser_worker.py"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  '\.\.\.',
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ASYNC", "B", "DTZ", "E", "F", "I", "PERF", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/jarvis/web.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "aiosqlite.*",
  "faster_whisper.*",
  "openwakeword.*",
  "cv2.*",
  "PIL.*",
  "respx.*",
  "silero_vad.*",
  "sounddevice.*",
]
ignore_missing_imports = true
